# 네트워크 키 없이 샘플 DB만으로 전체 흐름을 검증한다(Node.js·TypeScript).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # 매주 월요일 — 의존성·런타임이 바뀌어 깨지지 않았는지 정기 확인
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "lts/*"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # 빌드 + 단위/CLI 테스트 + .vsix 패키징 (Python·네트워크 불필요)
      - run: npm test
      # 커밋된 dist 가 소스와 같아야 git 설치가 빌드 없이 동작한다
      - run: git diff --exit-code -- dist
